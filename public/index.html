<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jworld</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        <i class="fas fa-globe"></i>
        <h2>Jworld</h2>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Search users...">
        <i class="fas fa-search"></i>
    </div>

    <div class="profile-nav">

        <img
        id="navProfilePic"
        src="https://picsum.photos/40">

        <span id="username">
            Loading...
        </span>

    </div>

</nav>

<div class="main-container">

    <!-- LEFT SIDEBAR -->

    <div class="sidebar">

        <div class="profile-card">

            <img
            id="profilePic"
            src="https://picsum.photos/100">

            <h3 id="profileName">
                User
            </h3>

            <p>
                Welcome To Jworld 🚀
            </p>

        </div>

        <ul>

            <li>
                <i class="fas fa-home"></i>
                Home
            </li>

            <li>
                <i class="fas fa-user"></i>
                Profile
            </li>

            <li>
                <i class="fas fa-users"></i>
                Followers
            </li>

            <li>
                <i class="fas fa-bell"></i>
                Notifications
            </li>

            <li>
                <i class="fas fa-bookmark"></i>
                Saved Posts
            </li>

            <li onclick="openSettings()">
                <i class="fas fa-cog"></i>
                Settings
            </li>

            <li onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </li>

        </ul>

    </div>

    <!-- FEED -->

    <div class="feed">

        <div class="create-post">

            <h3>Create Post</h3>

            <textarea
            id="postContent"
            placeholder="What's on your mind?"></textarea>

            <button onclick="createPost()">
                Post
            </button>

        </div>

        <div id="postsContainer">
            <!-- MongoDB Posts Load Here -->
        </div>

    </div>

    <!-- RIGHT SIDEBAR -->

    <div class="right-sidebar">

        <div class="card">

            <h3>Suggested Users</h3>

            <div id="usersContainer">
                <p>No users found</p>
            </div>

        </div>

        <div class="card">

            <h3>Trending Topics</h3>

            <p>#CJP</p>
            <p>#Animation</p>
            <p>#Viral reels</p>
            <p>#Fashion</p>
            <p>#Insta</p>

        </div>

    </div>

</div>

<!-- Settings Modal -->
<div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2>Settings ⚙️</h2>
        <form id="settingsForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Username</label>
                <input type="text" id="settingsUsername" placeholder="Enter new username" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email</label>
                <input type="email" id="settingsEmail" placeholder="Enter new email" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" onclick="closeSettings()" style="padding: 8px 16px; background: #ccc; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
                <button type="submit" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Comment Modal -->
<div id="commentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: rgba(30, 40, 60, 0.95); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(100, 200, 255, 0.2); border: 2px solid rgba(100, 200, 255, 0.3);">
        <h2 style="color: #64c8ff; margin-bottom: 20px;">Add Comment 💬</h2>
        <form style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <textarea id="commentText" placeholder="Write your comment..." style="width: 100%; padding: 12px; background: rgba(10, 14, 39, 0.5); border: 2px solid rgba(100, 200, 255, 0.2); border-radius: 8px; color: #e0e0e0; font-family: inherit; font-size: 14px; box-sizing: border-box; min-height: 80px; resize: none;"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" onclick="closeCommentModal()" style="padding: 10px 20px; background: rgba(100, 200, 255, 0.1); color: #64c8ff; border: 2px solid rgba(100, 200, 255, 0.2); border-radius: 8px; cursor: pointer; font-weight: bold;">Cancel</button>
                <button type="button" onclick="submitComment()" style="padding: 10px 20px; background: linear-gradient(135deg, #64c8ff, #0ea5e9); color: #0a0e27; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Post Comment</button>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
