<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jworld - Login</title>

<link rel="stylesheet" href="css/auth.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="left-panel">
        <h1>Jworld</h1>
        <p>
            Connect with friends, share your thoughts,
            create posts and interact with people around the world.
        </p>

        <div class="features">
            <p><i class="fas fa-users"></i> Follow Friends</p>
            <p><i class="fas fa-heart"></i> Like Posts</p>
            <p><i class="fas fa-comments"></i> Comment & Chat</p>
        </div>
    </div>

    <!-- Right Side -->
    <div class="login-card">

        <h2>Welcome Back 👋</h2>

        <form id="loginForm">

            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="register.html">
            <button class="register-btn">
                Create New Account
            </button>
        </a>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
